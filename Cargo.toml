[package]
name = "repov"
version = "0.1.1"
edition = "2021"
description = "A gitk-style TUI for exploring git repositories on macOS"
license = "MIT"
authors = ["Asha Somayajula <somayajulaas@gmail.com>"]
repository = "https://github.com/somayaj/repov"
homepage = "https://github.com/somayaj/repov"
readme = "README.md"
keywords = ["git", "tui", "terminal", "gitk", "repository"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "repov"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
git2 = "0.19"
ratatui = "0.29"
